components_manager:
    task_processors:  # Task processor is an executor for coroutine tasks

        main-task-processor:  # Make a task processor for CPU-bound coroutine tasks.
            worker_threads: $worker-threads  # Process tasks in 4 threads.

        fs-task-processor:  # Make a separate task processor for filesystem bound tasks.
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:  # Configuring components that were registered via component_list
        server:
            listener:  # configuring the main listening socket...
                port: $server-port  # ...to listen on this port and...
                task_processor: main-task-processor  # ...process incoming requests on this task processor.

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard  # Drop logs if the system is too busy to write them down.

        # Dynamic config options. Cache is disabled, updates are disabled.
        dynamic-config:
            # For most of userver dynamic configs, defaults are used, some are overridden here.
            # See userver "dynamic config" docs for what configs exist.
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500

        testsuite-support: {}

        congestion-control:

        http-client:
        http-client-core:
            fs-task-processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor

        tests-control:
            load-enabled: $is-testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor

        handler-frontend:
            path: /
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0

        handler-frontend-css:
            path: /styles.css
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0

        handler-frontend-js:
            path: /app.js
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0

        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        handler-hello:  # Finally! Our handler.
            path: /hello  # Registering handler by URL '/hello'.
            method: GET,POST  # It will only reply to GET (HEAD) and POST requests.
            task_processor: main-task-processor  # Run it on CPU bound task processor

        handler-hello-postgres:  # Our postgres handler.
            path: /hello-postgres  # Registering handler by URL '/hello-postgres'.
            method: GET,POST  # It will only reply to GET (HEAD) and POST requests.
            task_processor: main-task-processor  # Run it on CPU bound task processor

        handler-auth-register:
            path: /v1/auth/register
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0

        handler-auth-verify-email:
            path: /v1/auth/verify-email
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        handler-auth-login:
            path: /v1/auth/login
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        handler-resend-code:
            path: /v1/auth/resend-code
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0

        handler-auth-current-user:
            path: /v1/auth/me
            method: GET
            task_processor: main-task-processor
            auth:
                types:
                  - jwt

        profile-service: {}

        handler-get-profile:
            path: /v1/user/profile
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0
            auth:
                types:
                  - jwt

        handler-get-university-admins:
            path: /v1/education/universities/{university_id}/admins
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0
            auth:
                types:
                  - jwt

        postgres-db-1:
            dbconnection: $pg-connection
            dbconnection#env: DB_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async
            sync-start: true
            connlimit_mode: manual

        postbox-client:
            key-id: $postbox-key-id
            key-id#env: YANDEX_POSTBOX_KEY_ID
            secret-key: $postbox-secret-key
            secret-key#env: YANDEX_POSTBOX_SECRET_KEY
            from-email: $postbox-from-email
            from-email#env: YANDEX_POSTBOX_FROM_EMAIL
            url: $postbox-url

        email-service:
            send-enabled: $email-send-enabled
            log-codes: $email-log-codes

        s3-client:
            enabled#env: S3_ENABLED
            enabled#fallback: false
            endpoint#env: S3_ENDPOINT
            endpoint#fallback: storage.yandexcloud.net
            bucket#env: S3_BUCKET
            bucket#fallback: ''
            access-key#env: S3_ACCESS_KEY_ID
            access-key#fallback: ''
            secret-key#env: S3_SECRET_ACCESS_KEY
            secret-key#fallback: ''
            timeout-ms: 10000

        registration-service:
            verification-code-ttl-seconds: $email-verification-code-ttl-seconds

        email-verify-service: {}

        login-service: {}

        education-service: {}

        game-session-service: {}
        game-events: {}
        handler-frontend-game-js:
            path: /game.js
            method: GET
            task_processor: main-task-processor
        handler-frontend-qr-js:
            path: /vendor/qrcode.js
            method: GET
            task_processor: main-task-processor
        handler-game-state:
            path: /v1/game/sessions/{session_id}
            method: GET
            task_processor: main-task-processor
            auth:
                types: [jwt]
        handler-game-events:
            path: /v1/game/sessions/{session_id}/events
            method: GET
            task_processor: main-task-processor
            response-body-stream: true
            auth:
                types: [jwt]
        handler-game-join:
            path: /v1/game/sessions/join
            method: POST
            task_processor: main-task-processor
            max_request_size: 4096
            request_body_size_log_limit: 0
            auth:
                types: [jwt]
        handler-game-answer:
            path: /v1/game/sessions/{session_id}/answers
            method: POST
            task_processor: main-task-processor
            max_request_size: 4096
            request_body_size_log_limit: 0
            auth:
                types: [jwt]

        resend-code-service:
            verification-code-ttl-seconds: $email-verification-code-ttl-seconds

        handler-forgot-password-email-check:
            path: /v1/auth/forgot-password/email-check
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        handler-forgot-password-verify-code:
            path: /v1/auth/forgot-password/verify-code
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        handler-forgot-password-update-password:
            path: /v1/auth/forgot-password/update-password
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        forgot-password-service:
            password-reset-code-ttl-seconds: $password-reset-code-ttl-seconds
            password-reset-token-ttl-seconds: $password-reset-token-ttl-seconds

        jwt-service:
            secret#env: JWT_SECRET
            access-token-ttl-seconds: $jwt-access-token-ttl-seconds

        auth-session-service:
            session-lifetime-seconds: $session-lifetime-seconds

        handler-auth-refresh:
            path: /v1/auth/refresh
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0

        handler-auth-logout:
            path: /v1/auth/logout
            method: POST
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types:
                  - jwt
        handler-search-university-people:
            path: /v1/education/universities/{university_id}/people
            method: GET
            task_processor: main-task-processor
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types:
                  - jwt

        quiz-service: {}
        media-service: {}
        handler-create-quiz:
            path: /v1/quizzes
            method: POST
            task_processor: main-task-processor
            max_request_size: 1048576
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types: [jwt]
        handler-update-quiz:
            path: /v1/quizzes/{quiz_id}
            method: PUT
            task_processor: main-task-processor
            max_request_size: 1048576
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types: [jwt]
        handler-get-quiz:
            path: /v1/quizzes/{quiz_id}
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0
            auth:
                types: [jwt]
        handler-list-quizzes:
            path: /v1/quizzes
            method: GET
            task_processor: main-task-processor
            response_data_size_log_limit: 0
            auth:
                types: [jwt]
        handler-upload-image:
            path: /v1/media/images
            method: POST
            task_processor: main-task-processor
            max_request_size: 5300000
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types: [jwt]

        handler-frontend-quiz-js:
            path: /quiz.js
            method: GET
            task_processor: main-task-processor

        handler-create-game-session:
            path: /v1/game/sessions
            method: POST
            task_processor: main-task-processor
            max_request_size: 4096
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types: [jwt]

        handler-next-game-question:
            path: /v1/game/sessions/{session_id}/next
            method: POST
            task_processor: main-task-processor
            max_request_size: 4096
            request_body_size_log_limit: 0
            response_data_size_log_limit: 0
            auth:
                types: [jwt]

        handler-close-game-session:
            path: /v1/game/sessions/{session_id}/close
            method: POST
            task_processor: main-task-processor
