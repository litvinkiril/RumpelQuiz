worker-threads: 4
worker-fs-threads: 2
logger-level: info

is-testing: false

server-port: 8080

# Development PostgreSQL published by docker-compose.yml on the Windows host.
# DB_CONNECTION can override this value (see configs/static_config.yaml).
pg-connection: postgresql://rumpelquiz:rumpelquiz_dev@host.docker.internal:5433/rumpelquiz

postbox-url: https://postbox.cloud.yandex.net/v2/email/outbound-emails
email-send-enabled: false

# JWT_SECRET must be provided through .env for local development.
jwt-secret: ''
jwt-access-token-ttl-seconds: 3600
